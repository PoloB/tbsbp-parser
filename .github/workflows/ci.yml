name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: "test / py${{ matrix.python-version }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: 'auto'
          cache-suffix: ${{ matrix.python-version }}-${{ matrix.os }}

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: "Run pytest for python${{ matrix.python }}"
        run: |
          uv run pytest tests/ --cov=./ --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          files: ./coverage.xml
          verbose: true

  # ── Lint (ruff + mypy) ───────────────────────────────────────────────────────
  lint:
    name: "lint"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: 3.13
          enable-cache: 'auto'

      - name: Install dependencies
        run: uv sync --frozen --group lint

      - name: Ruff — lint
        run: uv run ruff check .

      - name: Ruff — format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

  # ── Benchmarks ───────────────────────────────────────────────────────────────
  benchmark:
    name: "benchmark"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: 3.13
          enable-cache: 'auto'

      - name: Install dependencies
        run: uv sync --frozen --group test --group test

      - name: Run benchmarks
        run: uv run pytest tests/ --benchmark-only --benchmark-json benchmark_result.json

      - name: Store and compare benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'pytest'
          output-file-path: benchmark_result.json
          # Where the previous data file is stored
          external-data-json-path: ./cache/benchmark-data-benchmark_result.json
          # Workflow will fail when an alert happens
          fail-on-alert: true
          # GitHub API token to make a commit comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Enable alert commit comment
          comment-on-alert: true
          # Enable Job Summary for PRs
          comment-always: true
          # Enable Job Summary for PRs
          summary-always: true